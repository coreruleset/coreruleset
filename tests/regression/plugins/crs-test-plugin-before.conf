#
# Test plugin for the regression tests of the plugin collect rules
# (REQUEST-901-INITIALIZATION.conf, rules 901600 to 901660).
#
# This file is only loaded by the test setup (tests/docker-compose.yml) and is
# never shipped in plugins/. It follows PLUGIN-CONTRACT.md: one variable per
# rule and list, named tx.plugin_<list>_<rule id>. All additions are limited
# to the path /crs-plugin-contract-test/, so the other regression tests are
# not affected.
#

# Methods, HTTP versions, restricted extensions and restricted headers.
# allowed_methods is set by two rules (9999001 and 9999002) to test that
# all matching variables are collected.
SecRule REQUEST_FILENAME "@beginsWith /crs-plugin-contract-test/" \
    "id:9999001,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.plugin_allowed_methods_9999001=|PROPFIND| |MKCOL|',\
    setvar:'tx.plugin_allowed_http_versions_9999001=HTTP/1.2',\
    setvar:'tx.plugin_restricted_extensions_9999001=.crstest/',\
    setvar:'tx.plugin_restricted_headers_basic_9999001=/x-crs-test-basic/',\
    setvar:'tx.plugin_restricted_headers_extended_9999001=/x-crs-test-extended/'"

SecRule REQUEST_FILENAME "@beginsWith /crs-plugin-contract-test/" \
    "id:9999002,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.plugin_allowed_methods_9999002=|REPORT|'"

# A content type together with the matching body processor (JSON), and a
# charset. The charset variable is also used to check that it does not end
# up in the content type list (anchor _[0-9]+$ in rule 901610).
SecRule REQUEST_FILENAME "@beginsWith /crs-plugin-contract-test/" \
    "id:9999003,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.plugin_allowed_request_content_type_charset_9999003=|utf-7|',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^application/x-crs-test(?:\s*;|$)" \
        "t:none,t:lowercase,\
        ctl:requestBodyProcessor=JSON,\
        setvar:'tx.plugin_allowed_request_content_type_9999003=|application/x-crs-test|'"
