version: "v0.0.0"
meta:
  engine: "ModSecurity v2"
  platform: "httpd"
  annotations:
    - purpose: "CRS test suite"
test_overrides:
  - rule_id: 920360
    test_ids: [1]
    reason: Requires ARG_NAME_LENGTH to be set to an appropriately low value
    output:
      status: 200
      log:
        no_expect_ids: [920360]
  - rule_id: 920380
    test_ids: [1]
    reason: Requires MAX_NUM_ARGS to be set to a sufficiently low value
    output:
      status: 200
      log:
        no_expect_ids: [920380]
  - rule_id: 934230
    test_ids: [1]
    reason: >-
      With the XML body processor engaged, ModSecurity v2 does not keep the raw body in
      REQUEST_BODY, so the entity declaration is not visible to the rule (see issue 4767)
    output:
      log:
        no_expect_ids: [934230]
