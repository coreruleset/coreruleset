  - test_id: 5
    desc: "Benign base64 cookie without pickle magic bytes does not match"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Accept-Encoding: "gzip,deflate"
            Accept-Language: "en-us,en;q=0.5"
            Content-Type: "application/x-www-form-urlencoded"
            Cookie: session=aGVsbG8gd29ybGQ=
          method: "POST"
          uri: "/post"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [934233]
  - test_id: 6
    desc: "Magic byte sequence embedded in benign base64 data does not match"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Accept-Encoding: "gzip,deflate"
            Accept-Language: "en-us,en;q=0.5"
            Content-Type: "application/x-www-form-urlencoded"
          method: "POST"
          uri: "/post"
          version: "HTTP/1.1"
          data: "note=xxgASVyygAWVzz"
        output:
          log:
            no_expect_ids: [934233]

  - test_id: 7
    desc: "Cookie with a stripped non-base64 char before the magic still matches ('g.ASV')"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Cookie: "username=g.ASVIgAAAAAAAAACMBHBvc2l4lIwGc3lzdGVtlJOUjAZ3aG9hbWmUhZRSlC4="
          method: GET
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [934233]
