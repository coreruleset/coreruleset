  - test_id: 10
    desc: 'GHSA: 934200 payload via XML attribute injection (verifies XML://@* coverage)'
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: POST
          port: 80
          headers:
            User-Agent: 'OWASP CRS test agent'
            Host: 'localhost'
            Content-Type: 'application/xml'
          uri: '/post'
          data: '<?xml version="1.0"?><root><a probe="&#x7B;&#x7B;7*7&#x7D;&#x7D;"></a></root>'
          version: 'HTTP/1.1'
        output:
          log:
            expect_ids: [934200]

