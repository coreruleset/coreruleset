---
meta:
  author: "zoutjebot"
rule_id: 934200
tests:
  # === Positive tests (should trigger) ===
  - test_id: 1
    desc: "Jinja2/Twig SSTI - arithmetic in double curly braces"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?x=%7b%7b7*7%7d%7d"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [934200]
  - test_id: 2
    desc: "Jinja2/Twig SSTI - dunder access in double curly braces"
    stages:
      - input:
          dest_addr: 127.0.0.1
