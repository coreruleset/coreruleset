            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?x=%7b%7b%27%27.__class__.__mro__%7d%7d"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [934200]
