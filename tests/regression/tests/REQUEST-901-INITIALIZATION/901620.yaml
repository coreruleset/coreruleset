---
meta:
  author: "franbuehler"
  description: "Plugin additions to tx.allowed_request_content_type_charset are collected (test plugin in tests/regression/plugins)"
rule_id: 901620
tests:
  - test_id: 1
    desc: "Positive test: charset utf-7 added by the test plugin (rule 9999003) is allowed on its path"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/json; charset=utf-7"
          method: POST
          port: 80
          uri: "/crs-plugin-contract-test/"
          data: '{"foo":"bar"}'
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [920480]
  - test_id: 2
    desc: "Negative test: the plugin addition is limited to its path"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/json; charset=utf-7"
          method: POST
          port: 80
          uri: "/"
          data: '{"foo":"bar"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [920480]
