---
meta:
  author: "franbuehler"
  description: "Plugin additions to tx.allowed_http_versions are collected (test plugin in tests/regression/plugins)"
rule_id: 901630
tests:
  - test_id: 1
    desc: "Positive test: HTTP/1.2 added by the test plugin (rule 9999001) is allowed on its path"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/crs-plugin-contract-test/"
          version: HTTP/1.2
        output:
          log:
            no_expect_ids: [920430]
  - test_id: 2
    desc: "Negative test: the plugin addition is limited to its path"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/"
          version: HTTP/1.2
        output:
          log:
            expect_ids: [920430]
