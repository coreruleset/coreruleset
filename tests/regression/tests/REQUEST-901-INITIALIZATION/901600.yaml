---
meta:
  author: "franbuehler"
  description: "Plugin additions to tx.allowed_methods are collected (test plugin in tests/regression/plugins)"
rule_id: 901600
tests:
  - test_id: 1
    desc: "Positive test: PROPFIND added by the test plugin (rule 9999001) is allowed on its path"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: PROPFIND
          port: 80
          uri: "/crs-plugin-contract-test/"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [911100]
  - test_id: 2
    desc: "Positive test: REPORT added by a second plugin rule (9999002) is collected too"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: REPORT
          port: 80
          uri: "/crs-plugin-contract-test/"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [911100]
  - test_id: 3
    desc: "Positive test: the CRS default method GET stays allowed after collecting"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/crs-plugin-contract-test/"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [911100]
  - test_id: 4
    desc: "Negative test: DELETE is added by no one and is still blocked"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: DELETE
          port: 80
          uri: "/crs-plugin-contract-test/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [911100]
  - test_id: 5
    desc: "Negative test: the plugin addition is limited to its path, PROPFIND is blocked elsewhere"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: PROPFIND
          port: 80
          uri: "/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [911100]
