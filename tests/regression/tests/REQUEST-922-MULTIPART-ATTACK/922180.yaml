---
meta:
  author: "devin-ai"
rule_id: 922180
tests:
  - test_id: 1
    desc: "php2shell PoC boundary ----0x4148php2shell is blocked"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Accept-Encoding: "gzip,deflate"
            Accept-Language: "en-us,en;q=0.5"
            Content-Type: "multipart/form-data; boundary=----0x4148php2shell"
          method: "POST"
          uri: "/post"
          version: "HTTP/1.1"
          data: "------0x4148php2shell\r\nContent-Disposition: form-data; name=\"test\"\r\n\r\n1\r\n------0x4148php2shell--\r\n"
        output:
          log:
            expect_ids: [922180]
