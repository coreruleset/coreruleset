          uri: "/get?foo=watch%20-n%201%20sh%20-i"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [932250]
  - test_id: 22
    desc: |
      Detect RCE with options between prefix and command (#4356)
      Payload: env -i sh -c id
