          uri: "/get?x=ls%20-l%20/etc/passwd"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [932250]
  - test_id: 8
    desc: "'ls' direct command injection (no flags)"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
