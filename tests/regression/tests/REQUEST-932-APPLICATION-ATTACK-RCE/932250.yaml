  - test_id: 25
    desc: |
      False positive: natural language after the watch prefix (#4356)
      Payload: watch my english class
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          uri: "/get?foo=watch%20my%20english%20class"
          version: "HTTP/1.1"
        output:
