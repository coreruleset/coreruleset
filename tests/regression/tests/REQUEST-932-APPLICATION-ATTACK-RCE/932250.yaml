          uri: "/get?show_comments_cookies_opt_in=true"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [932250]
  - test_id: 12
    desc: "FP for 'ls' without word boundary in cookie header value"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Cookie: "ocvsgo2tnqtc=ls08e58tnf8b027oo1nr5sv3cc"
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [932250]
  - test_id: 13
    desc: "FP for '7z' without word boundary in cookie header value"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Cookie: "oc_sessionPassphrase=7ZSW6ZeHbe3SpaUje9ThKrPf86%2B6reu1QPtwIXFYhfGTtDUXa99eNn2P2Ve2SqeJAyq%2FXYPi1zuif%2FLRj3da0RUXYlTzizBACJ9HgiNQax72lEFNKajSuHuOeqYvVRgT"
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [932250]
  - test_id: 14
    desc: "FP for 'rc'"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          uri: "/get?param=rc"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [932250]
  - test_id: 15
    desc: "True Positive: Block aa-disable"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          uri: "/get?param=aa-disable%20php-fpm"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [932250]
  - test_id: 16
    desc: 'GHSA: 932250 payload via XML attribute injection (verifies XML://@* coverage)'
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: POST
          port: 80
          headers:
            User-Agent: 'OWASP CRS test agent'
            Host: 'localhost'
            Content-Type: 'application/xml'
          uri: '/post'
          data: '<?xml version="1.0"?><root><a probe="c99 -wrapper sh,-c,curl google.com ."></a></root>'
          version: 'HTTP/1.1'
        output:
          log:
            expect_ids: [932250]
  - test_id: 17
    desc: "False Positive"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: POST
          port: 80
          uri: "/post"
          version: HTTP/1.1
          data: |
            code=|PG|XXX XXX Flash Sale Mxc3xa4rz
        output:
          log:
            no_expect_ids: [932250]
  - test_id: 18
    desc: |
      True Positive: Block aa-disable
      4RI-250413
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          uri: "/"
          data: '{ "aa-disable php-fpm":"foo" }'
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [932250]
  - test_id: 19
    desc: |
      Detect RCE in last path segment
      Payload: ;7zx filename.ext
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          uri: /path/with/%3B7zx%20filename.ext
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [932250]
  - test_id: 20
    desc: |
      Detect RCE with options between prefix and command (#4356)
      Payload: time -p sh -i
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          uri: "/get?foo=time%20-p%20sh%20-i"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [932250]
  - test_id: 21
    desc: |
      Detect RCE with option and argument between prefix and command (#4356)
      Payload: watch -n 1 sh -i
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
