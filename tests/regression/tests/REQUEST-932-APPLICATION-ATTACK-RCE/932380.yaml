    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?view%3Dimage.jpg%26csvde%20-f%20out.csv"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [932380]
  - test_id: 19
