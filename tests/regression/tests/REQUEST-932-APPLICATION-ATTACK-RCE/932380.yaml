          method: GET
          port: 80
          uri: "/get?view%3Dimage.jpg%26d%22s%22acls"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [932380]
  - test_id: 25
    desc: |
      Windows shell command injection with 'dsmgmt' called by path:
      view=image.jpg%26\Windows\System32\dsmgmt
      Match dsmgmt (AD DS database management) with a path prefix
    stages:
