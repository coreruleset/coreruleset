      No false positive on benign word containing the 'ds' command substrings: broadsword
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: POST
          port: 80
          uri: "/post"
          version: HTTP/1.1
          data: "payload=the broadsword and windshield were goldsmith made"
        output:
          log:
            no_expect_ids: [932380]
