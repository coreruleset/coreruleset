---
meta:
  author: "kosoyyagent"
  description: "Tests for rule 933260 (PHP session upload-progress object injection)"
rule_id: 933260
tests:
  - test_id: 1
    desc: "Should block: PHP_SESSION_UPLOAD_PROGRESS value carries a serialized object after a pipe"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: multipart/form-data; boundary=boundary
          method: POST
          port: 80
          uri: "/post"
          data: |
            --boundary
            Content-Disposition: form-data; name="PHPSESSID"

            abc123defghijklmnopqrstuvw
            --boundary
            Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"

            |O:9:"LabGadget":1:{s:3:"cmd";s:6:"whoami";}
            --boundary--
          version: HTTP/1.1
        output:
          log:
            expect_ids: [933260]
  - test_id: 2
    desc: "Should block: pipe + serialized scalar payload (|i:)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: multipart/form-data; boundary=boundary
          method: POST
          port: 80
          uri: "/post"
          data: |
            --boundary
            Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"

            12345|s:7:"injected";
            --boundary--
          version: HTTP/1.1
        output:
          log:
            expect_ids: [933260]
  - test_id: 3
    desc: "Should not block: urlencoded field is not an attack carrier (PHP reads the field only from multipart bodies)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "PHP_SESSION_UPLOAD_PROGRESS=%7CO%3A8%3A%22stdClass%22%3A0%3A%7B%7D"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [933260]
  - test_id: 4
    desc: "Should not block: plain upload-progress identifier value in a multipart body"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: multipart/form-data; boundary=boundary
          method: POST
          port: 80
          uri: "/post"
          data: |
            --boundary
            Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"

            12345
            --boundary--
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [933260]
  - test_id: 5
    desc: "Should not block: unrelated field carrying a pipe in a multipart body"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: multipart/form-data; boundary=boundary
          method: POST
          port: 80
          uri: "/post"
          data: |
            --boundary
            Content-Disposition: form-data; name="search"

            alpha|beta
            --boundary
            Content-Disposition: form-data; name="PHP_PROGRESS"

            12345
            --boundary--
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [933260]
  - test_id: 6
    desc: "Should not block: PHP_SESSION_UPLOAD_PROGRESS named differently (substring must not match)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: multipart/form-data; boundary=boundary
          method: POST
          port: 80
          uri: "/post"
          data: |
            --boundary
            Content-Disposition: form-data; name="MY_PHP_SESSION_UPLOAD_PROGRESS_X"

            |O:4:"Evil":0:{}
            --boundary--
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [933260]
