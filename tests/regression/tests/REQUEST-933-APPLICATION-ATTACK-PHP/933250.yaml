---
meta:
  author: "kosoyyagent"
  description: "Tests for Serialized PHP Data in Upload Filename Detection (CVE-2026-109619)"
rule_id: 933250
tests:
  - test_id: 1
    desc: "Should block: serialized object after pipe in filename (handler mismatch chain)"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Content-Type: "multipart/form-data; boundary=--------397236876"
          uri: "/index.php"
          data: |
            ----------397236876
            Content-Disposition: form-data; name="f"; filename="x|O:8:\"Gadget\":0:{}"
            Content-Type: application/octet-stream

            Z
            ----------397236876--
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [933250]
  - test_id: 2
    desc: "Should block: serialized array after pipe in filename"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Content-Type: "multipart/form-data; boundary=--------397236876"
          uri: "/index.php"
          data: |
            ----------397236876
            Content-Disposition: form-data; name="f"; filename="x|a:1:{i:0;s:3:\"foo\";}"
            Content-Type: application/octet-stream

            Z
            ----------397236876--
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [933250]
  - test_id: 3
    desc: "Should block: serialized object via X-Filename header"
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: POST
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            X-Filename: "x|O:8:\"Gadget\":0:{}"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          uri: /upload
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [933250]
  - test_id: 4
    desc: "Should pass: filename with plain pipe character"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Content-Type: "multipart/form-data; boundary=--------397236876"
          uri: "/index.php"
          data: |
            ----------397236876
            Content-Disposition: form-data; name="f"; filename="report|final.txt"
            Content-Type: application/octet-stream

            Z
            ----------397236876--
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [933250]
  - test_id: 5
    desc: "Should pass: pipe followed by non-serialized text"
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: POST
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            X-Filename: version|2.txt
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          uri: /upload
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [933250]
  - test_id: 6
    desc: "Should pass: normal filename"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "OWASP CRS test agent"
            Host: "localhost"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Content-Type: "multipart/form-data; boundary=--------397236876"
          uri: "/index.php"
          data: |
            ----------397236876
            Content-Disposition: form-data; name="f"; filename="photo.jpg"
            Content-Type: image/jpeg

            binary
            ----------397236876--
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [933250]
