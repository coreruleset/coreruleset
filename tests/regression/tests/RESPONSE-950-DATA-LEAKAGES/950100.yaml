---
meta:
  author: "azurit"
rule_id: 950100
tests:
  - test_id: 1
    desc: "Response status 500 should trigger the rule"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5"
            Accept-Encoding: "gzip,deflate"
            Accept-Language: "en-us,en;q=0.5"
            Content-Type: "application/json"
          method: "POST"
          version: "HTTP/1.1"
          uri: "/reflect"
          data: |-
            {"status": 500}
        output:
          log:
            expect_ids: [950100]
  - test_id: 2
    desc: "Response status 404 should NOT trigger the rule"
    stages:
      - input:
          dest_addr: "127.0.0.1"
