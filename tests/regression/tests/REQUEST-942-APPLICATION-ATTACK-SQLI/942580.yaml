---
meta:
  author: "kosoyyagent"
  description: "Tests for rule 942580 (ORDER BY with sort direction)"
rule_id: 942580
tests:
  - test_id: 1
    desc: "ORDER BY 1 ASC evades libinjection at PL1 (issue #4884)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?var=admin'ORDER+BY+1+ASC+--+-"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [942580]
  - test_id: 2
    desc: "ORDER BY 1 DESC evades libinjection at PL1 (issue #4883)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?var=admin'ORDER+BY+1+DESC+%23"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [942580]
  - test_id: 3
    desc: "ORDER BY with column list and DESC"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: POST
          port: 80
          uri: "/post"
          data: "var=x' ORDER BY 1,2 DESC -- "
          version: HTTP/1.1
        output:
          log:
            expect_ids: [942580]
  - test_id: 4
    desc: "ORDER BY with column name and ASC in cookie"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Cookie: "sess=abc' ORDER BY id ASC -- "
          method: GET
          port: 80
          uri: "/get"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [942580]
  - test_id: 5
    desc: "English text 'order by date descending' must not match"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: POST
          port: 80
          uri: "/post"
          data: "var=please order by date descending"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [942580]
  - test_id: 6
    desc: "plain 'order by name' without direction must not match"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: POST
          port: 80
          uri: "/post"
          data: "var=results order by name"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [942580]
  - test_id: 7
    desc: "'reorder by 1 asc' must not match (word boundary)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: POST
          port: 80
          uri: "/post"
          data: "var=reorder by 1 asc"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [942580]
