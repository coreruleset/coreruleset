---
meta:
  author: "airween"
rule_id: 944170
tests:
  - test_id: 1
    desc: "Java4Shell PoC (64 x A + '=') in Authorization Basic header"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944170]
  - test_id: 2
    desc: "Java4Shell PoC with Base64url alphabet (66 x [-_] + '=') in Authorization Bearer header"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Bearer -_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944170]
  - test_id: 3
    desc: "Long Java4Shell PoC (4096 x A + '=') in Authorization Basic header"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic "
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944170]
  - test_id: 4
    desc: "False positive check: valid, padded Authorization Basic credentials (the scheme and the credentials stay separate)"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic c2VydmljZS1hY2NvdW50QGV4YW1wbGUuY29tOlMzY3IzdC14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944170]
  - test_id: 5
    desc: "False positive check: valid, padded Authorization Basic credentials containing '+' (UTF-8 username:password 'some.user@example.com:Amount-of-13<EURO SIGN>-...'; the euro sign in the password produces the '+')"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic c29tZS51c2VyQGV4YW1wbGUuY29tOkFtb3VudC1vZi0xM+KCrC1zdW1tZXItaG9saWRheS1hZHZhbmNlLXBheW1lbnQtZm9yLXRoZS1mYW1pbHktdHJpcA=="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944170]
