---
meta:
  author: "airween"
rule_id: 944160
tests:
  - test_id: 1
    desc: "Java4Shell PoC (64 x A + '=') in POST argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "foo=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%3D"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 2
    desc: "Java4Shell PoC for OpenJDK 17 (128 x A + '=') in query string"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?token=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%3D"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 3
    desc: "Java4Shell PoC in Authorization Basic header"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 4
    desc: "Java4Shell PoC in JSON body"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/json
          method: POST
          port: 80
          uri: "/post"
          data: "{\"img\":\"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\"}"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 5
    desc: "Java4Shell PoC with Base64url alphabet and invalid padding (66 x [-_] + '=') in POST argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "foo=-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_%3D"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 6
    desc: "False positive check: valid, correctly padded Base64 of zero bytes"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "foo=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%3D%3D"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944160]
  - test_id: 7
    desc: "False positive check: valid Base64 with '=' padding (xxx=)"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "foo=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg%3D"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944160]
  - test_id: 8
    desc: "False positive check: short Base64-like token with invalid padding"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "foo=AAAAAAAAAAAAAAAAAAAA%3D"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944160]
  - test_id: 9
    desc: "False positive check: valid, padded Authorization Basic credentials must not match (the scheme and the credentials stay separate tokens)"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic c2VydmljZS1hY2NvdW50QGV4YW1wbGUuY29tOlMzY3IzdC14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944160]
  - test_id: 10
    desc: "Java4Shell PoC with literal '+' in a header (3 x 42 x A joined by '+', then '='); '+' must not be decoded to a space"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            X-Auth-Token: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 11
    desc: "Java4Shell PoC with URL-encoded '+' (%2B) in POST argument; decoded value is 3 x 42 x A joined by '+', then '='"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: "application/x-www-form-urlencoded"
          method: POST
          port: 80
          uri: "/post"
          data: "foo=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%2BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%2BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%3D"
          version: "HTTP/1.1"
        output:
          log:
            expect_ids: [944160]
  - test_id: 12
    desc: "False positive check: valid, padded Authorization Basic credentials containing '+' must not match (UTF-8 username:password 'some.user@example.com:Amount-of-13<EURO SIGN>-...'; the euro sign in the password produces the '+')"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          headers:
            Accept: "*/*"
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Authorization: "Basic c29tZS51c2VyQGV4YW1wbGUuY29tOkFtb3VudC1vZi0xM+KCrC1zdW1tZXItaG9saWRheS1hZHZhbmNlCg=="
          method: GET
          port: 80
          uri: "/get"
          version: "HTTP/1.1"
        output:
          log:
            no_expect_ids: [944160]
