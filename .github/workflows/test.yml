name: Regression Tests

on:
  push:
    branches:
      - main
      - v3.3/dev
      - v3.3/master
      - lts/v4.25.x
    paths:
      - 'rules/**'
      - 'tests/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - v3.3/dev
      - v3.3/master
      - lts/v4.25.x
    paths:
      - 'rules/**'
      - 'tests/**'
      - 'util/**'
      - '.github/**'
  merge_group:

permissions:
  contents: read

# Pin tool versions to prevent problems
env:
  GO_FTW_VERSION: '2.3.0'

jobs:
  regression:
    name: regression (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Experimental targets should not fail the run immediately
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: modsec2-apache
            overrides: httpd-overrides.yaml
            experimental: false
          - target: modsec3-nginx
            overrides: nginx-overrides.yaml
            experimental: false
          - target: coraza-caddy
            overrides: coraza-overrides.yaml
            experimental: true
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Install dependencies"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R coreruleset/go-ftw "v${{ env.GO_FTW_VERSION }}" \
            -p "ftw_${{ env.GO_FTW_VERSION }}_linux_amd64.tar.gz" -O - | tar -xzvf - ftw

      - name: "Run tests for ${{ matrix.target }}"
        run: |
          mkdir -p "tests/logs/${{ matrix.target }}"
          docker compose -f ./tests/docker-compose.yml up -d "${{ matrix.target }}"
          echo "Waiting for container to become ready"
          curl --retry 5 --retry-connrefused --retry-delay 2 localhost || true
          sleep 5
          docker compose -f ./tests/docker-compose.yml logs
          if ! [ "$(docker inspect ${{ matrix.target }} --format='{{.State.Running}}')" = "true" ]; then
            echo "Web server failed to start. Aborting."
            exit 1
          fi

          ./ftw check -d tests/regression/tests
          ./ftw run \
            -d tests/regression/tests \
            --log-file "tests/logs/${{ matrix.target }}/error.log" \
            --overrides "tests/regression/${{ matrix.overrides }}" \
            --show-failures-only \
            --store-failure-waf-logs

      - name: "Change permissions of artifacts for upload"
        if: failure()
        run: |
          # Files created from the container will belong to root
          sudo chmod -R a+r tests/logs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: waf-logs-${{ matrix.target }}
          path: tests/logs/${{ matrix.target }}

      - name: Clean docker-compose
        run: |
          docker compose -f ./tests/docker-compose.yml stop "${{ matrix.target }}"
          docker compose -f ./tests/docker-compose.yml down
