name: Release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, e.g. v4.30.0'
        required: true

permissions:
  contents: read

env:
  NFPM_VERSION: '2.43.0'
  NFPM_SHA256: '4a4402f8f9ea87c669d6a62b333f8e268439974754dd886a01731ecaf9fa6d66'
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    # Debian sorts 4.31.0-rc1 above 4.31.0, so release candidates get no packages
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      # The scripts come from the default branch; the release content comes from the tag
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install nfpm
        run: |
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "${NFPM_SHA256}  nfpm_${NFPM_VERSION}_amd64.deb" | sha256sum -c -
          sudo dpkg -i "nfpm_${NFPM_VERSION}_amd64.deb"

      - name: Build packages
        run: packaging/build.sh "${TAG#v}" build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - debian:stable
          - rockylinux:9
    container: ${{ matrix.image }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: packages

      - name: Install and test
        run: bash packaging/smoke-test.sh packages

  upload:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: packages

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" packages/* --clobber --repo "${GITHUB_REPOSITORY}"
