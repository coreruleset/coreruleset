# Loads OWASP CRS as installed by the owasp-crs package. Include this file
# once from the engine configuration, for Apache (mod_security2) or from the
# file named by nginx's modsecurity_rules_file (libmodsecurity3):
#
#   Include /usr/share/owasp-crs/owasp-crs.conf
#
# Configuration, exclusions and plugins live in /etc/owasp-crs/.

Include /etc/owasp-crs/crs-setup.conf
Include /etc/owasp-crs/plugins/*-config.conf
Include /etc/owasp-crs/plugins/*-before.conf
Include /etc/owasp-crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/owasp-crs/rules/*.conf
Include /etc/owasp-crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
Include /etc/owasp-crs/plugins/*-after.conf
